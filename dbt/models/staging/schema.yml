version: 2

sources:
  - name: raw
    schema: raw
    description: "Landing zone written directly by Airflow DAGs."
    tables:
      - name: hn_mentions
      - name: crunchbase_funding
      - name: github_activity

models:
  - name: stg_mentions
    description: "Cleaned view of HackerNews mentions (stories + comments)."
    columns:
      - name: mention_id
        tests: [not_null]
      - name: company_slug
        tests: [not_null]
      - name: mention_type
        tests:
          - accepted_values:
              values: ["story", "comment"]
      - name: points
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                severity: warn

  - name: stg_funding
    description: "Cleaned view of Crunchbase funding rounds."
    columns:
      - name: round_id
        tests: [not_null]
      - name: company_slug
        tests: [not_null]
      - name: announced_on
        tests: [not_null]

  - name: stg_github
    description: "Cleaned view of daily GitHub activity snapshots."
    columns:
      - name: repo_full_name
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
